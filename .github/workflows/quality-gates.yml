name: CI / Quality Gates

on:
  push:
    branches:
      - main
      - raffle-feature
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run isolated Twitch rehearsal and record UI snapshots
        env:
          LUPUSARIA_REHEARSAL_TRACE: ${{ runner.temp }}/raffle-rehearsal.json
        run: go test ./internal/rehearsal -run '^TestRaffleRehearsal$' -count=1 -v

      - name: Run frontend tests
        env:
          LUPUSARIA_REHEARSAL_TRACE: ${{ runner.temp }}/raffle-rehearsal.json
        working-directory: frontend
        run: npm test

      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raffle-rehearsal-trace
          path: ${{ runner.temp }}/raffle-rehearsal.json
          if-no-files-found: error

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  windows-smoke:
    needs: quality-gates
    uses: ./.github/workflows/windows-smoke.yml
    permissions:
      contents: read
